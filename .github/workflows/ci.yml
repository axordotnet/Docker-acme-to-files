name: Test and publish
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python: ['3.13', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -v
      - run: pip-audit -r requirements.txt
      - name: Build and exercise the hardened container
        if: matrix.python == '3.15'
        run: |
          docker build --pull --no-cache -t acme-to-files:test .
          PYTHONPATH=src:tests python tests/container_smoke.py
      - name: Report all image vulnerabilities
        if: matrix.python == '3.15'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: acme-to-files:test
          scanners: vuln
          exit-code: '0'
          format: table
      - name: Reject fixable HIGH and CRITICAL image vulnerabilities
        if: matrix.python == '3.15'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          skip-setup-trivy: true
          image-ref: acme-to-files:test
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  publish:
    needs: test
    if: >-
      github.repository == 'axordotnet/Docker-acme-to-files' &&
      (github.event_name == 'push' ||
       ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
        github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      release_enabled: ${{ steps.release.outputs.enabled }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Determine release version
        id: release
        env:
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re, tomllib
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version):
              raise SystemExit('Expected a stable semantic version')
          title = os.environ.get('HEAD_MESSAGE', '').split('\n', 1)[0]
          enabled = os.environ['GITHUB_REF'] == 'refs/heads/main' and title == f'release: v{version}'
          if enabled and not pathlib.Path(f'docs/releases/v{version}.md').is_file():
              raise SystemExit('Missing versioned release notes')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\nenabled={str(enabled).lower()}\n')
          PY
      - name: Refuse to overwrite an existing release tag
        if: steps.release.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          count=$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v${VERSION}" --jq 'length')
          test "$count" = 0 || { echo 'Release tag already exists; choose a new version.'; exit 1; }
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/axordotnet/docker-acme-to-files
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ steps.release.outputs.version }},enable=${{ steps.release.outputs.enabled }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # Scan the exact candidate digest before promoting it to user-facing tags.
          tags: ghcr.io/axordotnet/docker-acme-to-files:build-${{ github.run_id }}-${{ github.run_attempt }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          pull: true
          no-cache: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan exact AMD64 candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          version: v0.76.2
          image-ref: ghcr.io/axordotnet/docker-acme-to-files@${{ steps.build.outputs.digest }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan exact ARM64 candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          version: v0.76.2
          skip-setup-trivy: true
          image-ref: ghcr.io/axordotnet/docker-acme-to-files@${{ steps.build.outputs.digest }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Promote scanned manifest to published tags
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          args=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then args+=(--tag "$tag"); fi
          done <<< "$IMAGE_TAGS"
          docker buildx imagetools create "${args[@]}" "ghcr.io/axordotnet/docker-acme-to-files@${IMAGE_DIGEST}"

  verify-public-image:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify anonymous pull (package must be public)
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          export DOCKER_CONFIG="$(mktemp -d)"
          docker pull "ghcr.io/axordotnet/docker-acme-to-files@${DIGEST}"
          docker run --rm --network none "ghcr.io/axordotnet/docker-acme-to-files@${DIGEST}" --help
      - name: Verify versioned image
        if: needs.publish.outputs.release_enabled == 'true'
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          export DOCKER_CONFIG="$(mktemp -d)"
          docker pull "ghcr.io/axordotnet/docker-acme-to-files:${VERSION}"
          docker run --rm --network none "ghcr.io/axordotnet/docker-acme-to-files:${VERSION}" --help

  release:
    needs: [publish, verify-public-image]
    if: needs.publish.outputs.release_enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create Git tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.publish.outputs.version }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          notes="${RUNNER_TEMP}/release-notes.md"
          cat "docs/releases/v${VERSION}.md" > "$notes"
          printf '\nImage: `ghcr.io/axordotnet/docker-acme-to-files:%s`\n\nDigest: `%s`\n' "$VERSION" "$DIGEST" >> "$notes"
          gh release create "v${VERSION}" --target "$GITHUB_SHA" --title "v${VERSION}" --notes-file "$notes"
